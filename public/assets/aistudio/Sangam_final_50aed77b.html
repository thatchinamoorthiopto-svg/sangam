<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Sangam Workspace</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: framed app. Org rail | list panel | detail pane. Phone: org strip on top, list, bottom tabs, detail slides over. */
@property --accent{syntax:'<color>';inherits:true;initial-value:#1F6FD0}
:root{
  --bg:#E9EEF4; --surface:#FFFFFF; --surface2:#F3F6FA; --ink:#0F1B2D; --muted:#5A6A80; --line:#DCE3EC;
  --accent:#1F6FD0; --on-accent:#FFFFFF; --good:#17824F; --live:#D8362F;
  --accent-text:color-mix(in srgb,var(--accent) 78%,var(--ink));
  --accent-soft:color-mix(in srgb,var(--accent) 12%,var(--surface));
  --accent-line:color-mix(in srgb,var(--accent) 35%,var(--line));
  --shadow:0 1px 2px rgba(15,27,45,.06),0 12px 40px rgba(15,27,45,.10);
  --f-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#080E18; --surface:#101A2A; --surface2:#162338; --ink:#E9EFF7; --muted:#8FA1B8; --line:#233450;
  --good:#3CC184; --live:#FF6B63; --shadow:0 1px 2px rgba(0,0,0,.4),0 16px 48px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#080E18; --surface:#101A2A; --surface2:#162338; --ink:#E9EFF7; --muted:#8FA1B8; --line:#233450;
  --good:#3CC184; --live:#FF6B63; --shadow:0 1px 2px rgba(0,0,0,.4),0 16px 48px rgba(0,0,0,.45); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{flex:none;display:block}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;font:600 13px var(--f-body);color:#fff;background:hsl(var(--h) 42% 38%)}
.av.sm{width:26px;height:26px;font-size:10px}.av.lg{width:48px;height:48px;font-size:16px}

/* ---------- login ---------- */
.login{min-height:100%;display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:center;max-width:1100px;margin:0 auto}
.lbrand{display:flex;flex-direction:column;gap:22px;min-width:0}
.wordmark{display:flex;align-items:center;gap:10px;font:700 22px var(--f-display);letter-spacing:-.02em}
.wordmark .logo{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:18px;transition:background .6s}
.tagproto{font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:2px 8px}
.lbrand h1{font:700 clamp(34px,5vw,56px)/1.02 var(--f-display);letter-spacing:-.035em;text-wrap:balance;max-width:14ch}
.lbrand h1 em{font-style:normal;color:var(--accent-text);transition:color .6s}
.lbrand .sub{color:var(--muted);max-width:44ch;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip-org{display:flex;align-items:center;gap:8px;padding:7px 12px 7px 8px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-weight:500;font-size:13px;animation:bob 4.5s ease-in-out infinite;animation-delay:calc(var(--i)*-.9s)}
.chip-org i{width:22px;height:22px;border-radius:7px;background:var(--oa);display:grid;place-items:center;color:#fff;font:600 10px var(--f-body);font-style:normal}
.pts{display:grid;gap:8px;color:var(--muted);font-size:14px;padding:0;margin:0;list-style:none}
.pts li{display:flex;gap:10px;align-items:center}.pts .ic{color:var(--good)}
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:26px;display:grid;gap:18px;animation:rise .7s cubic-bezier(.2,.8,.2,1) both;min-width:0}
.seg2{display:grid;grid-template-columns:1fr 1fr;background:var(--surface2);border-radius:12px;padding:4px;gap:4px}
.seg2 button{padding:9px;border-radius:9px;font-weight:600;color:var(--muted);transition:all .25s}
.seg2 button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(15,27,45,.12)}
.lcard h2{font:700 24px var(--f-display);letter-spacing:-.02em}
form{display:grid;gap:14px}
.fld{display:grid;gap:6px}.fld label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.fld textarea{resize:vertical}
.fld input,.fld select,.fld textarea{width:100%;padding:11px 13px;border-radius:11px;border:1px solid var(--line);background:var(--surface2);transition:border-color .2s,box-shadow .2s}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;background:var(--accent);color:var(--on-accent);font-weight:600;transition:transform .15s,filter .2s,background .5s;position:relative;overflow:hidden}
.btn:hover{filter:brightness(1.07)}.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:8px 13px;font-size:13px;border-radius:10px}
.err{color:var(--live);font-size:13px;min-height:0}
.demo{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 14px;border-radius:12px;background:var(--accent-soft);border:1px dashed var(--accent-line);font-size:13px}
.demo b{font-weight:600}.demo code{font:500 12px/1.4 ui-monospace,Menlo,monospace;color:var(--muted);overflow-wrap:anywhere}

/* ---------- app shell ---------- */
#app{height:100%;max-width:1400px;margin:0 auto;display:grid;grid-template-columns:76px 340px minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:--accent .6s ease}
#app.enter{animation:appin .6s cubic-bezier(.2,.8,.2,1) both}
.rail{background:var(--surface2);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 0;min-height:0}
.rail .logo{width:40px;height:40px;border-radius:12px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:700 20px var(--f-display);margin-bottom:6px;transition:background .6s}
.orgs{display:flex;flex-direction:column;gap:10px;flex:1;align-items:center}
.orgb{position:relative;width:46px;height:46px;border-radius:15px;background:var(--oa);color:#fff;font:600 13px var(--f-body);display:grid;place-items:center;transition:border-radius .3s,transform .2s,opacity .2s;opacity:.78}
.orgb:hover{opacity:1;transform:translateY(-2px)}
.orgb.on{border-radius:23px;opacity:1}
.orgb::before{content:"";position:absolute;left:-15px;top:50%;width:4px;height:0;border-radius:0 4px 4px 0;background:var(--accent);transform:translateY(-50%);transition:height .3s}
.orgb.on::before{height:26px}
.me{border-radius:50%}
.panel{display:flex;flex-direction:column;min-width:0;min-height:0;border-right:1px solid var(--line)}
.phead{padding:18px 18px 12px;display:grid;gap:2px}
.phead h2{font:700 20px var(--f-display);letter-spacing:-.02em;line-height:1.15}
.phead p{color:var(--muted);font-size:13px}
.tabs{position:relative;display:grid;grid-template-columns:repeat(4,1fr);margin:0 14px 8px;background:var(--surface2);border-radius:13px;padding:4px}
.tabs button{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:8px 2px 7px;font-weight:600;font-size:11.5px;color:var(--muted);transition:color .25s;min-width:0}
.tabs button.on{color:var(--accent-text)}
.tabs .ind{position:absolute;z-index:0;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/4);border-radius:10px;background:var(--surface);box-shadow:0 1px 3px rgba(15,27,45,.14);transition:transform .35s cubic-bezier(.3,1.3,.4,1)}
.ptools{padding:4px 14px 8px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.search{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:11px;background:var(--surface2);border:1px solid transparent;color:var(--muted)}
.search:focus-within{border-color:var(--accent)}
.search input{border:0;background:none;outline:0;flex:1;min-width:0;color:var(--ink)}
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.fchips button{padding:5px 12px;border-radius:99px;border:1px solid var(--line);font-size:12.5px;font-weight:500;color:var(--muted);transition:all .2s}
.fchips button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.plist{flex:1;overflow:auto;padding:4px 8px 12px;min-height:0}
.grp{padding:12px 10px 6px;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:10px;border-radius:14px;transition:background .2s,transform .2s;animation:rise .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*30ms)}
.item:hover{background:var(--surface2)}
.item.on{background:var(--accent-soft)}
.tile{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none;background:var(--surface2);color:var(--muted)}
.t-all{background:var(--accent);color:var(--on-accent)}
.t-branch{background:var(--accent-soft);color:var(--accent-text)}
.t-team{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.ib{display:grid;gap:2px;min-width:0;flex:1}
.r1,.r2{display:flex;gap:8px;align-items:center;justify-content:space-between;min-width:0}
.r1 b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r1 time,.r1 span.tm{font-size:12px;color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.pv{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{flex:none;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--accent);color:var(--on-accent);font:600 11px/20px var(--f-body);font-style:normal;text-align:center;animation:pulse 2.4s infinite}
.ring{position:relative;overflow:hidden;display:grid;padding:2.5px;border-radius:50%;flex:none}
.ring::before{content:"";position:absolute;inset:-40%;background:conic-gradient(var(--accent),color-mix(in srgb,var(--accent) 20%,transparent),var(--accent));animation:spin 7s linear infinite}
.ring .av{position:relative;border:2.5px solid var(--surface);width:44px;height:44px}
.ring.seen::before{background:var(--line);animation:none}
.ring.add{border:1.5px dashed var(--accent-line);padding:2px}.ring.add::before{display:none}
.plus{margin-left:auto;width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;flex:none}
.mt-time{font:700 15px var(--f-display);width:74px;flex:none;line-height:1.15;font-variant-numeric:tabular-nums}
.mt-time small{display:block;font:500 11px var(--f-body);color:var(--muted)}
.livepill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--live)}
.livepill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--live);animation:blink 1.2s infinite}

/* ---------- main pane ---------- */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg);position:relative}
.main.enter>*{animation:fadein .45s ease both}
.back{display:none;width:36px;height:36px;border-radius:10px;align-items:center;justify-content:center;background:var(--surface2);flex:none}
.chat,.sv,.mdetail{display:flex;flex-direction:column;min-height:0;flex:1}
.chead{display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.ct{min-width:0;flex:1}.ct h2{font:700 18px var(--f-display);letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct p{color:var(--muted);font-size:13px}
.hint{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--surface));padding:5px 10px;border-radius:99px;flex:none}
.msgs{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px;min-height:0;background-image:radial-gradient(color-mix(in srgb,var(--ink) 6%,transparent) 1px,transparent 1px);background-size:18px 18px}
.day{align-self:center;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:3px 12px;border-radius:99px}
.msg{max-width:min(78%,560px);background:var(--surface);border:1px solid var(--line);border-radius:4px 18px 18px 18px;padding:10px 14px 9px;display:grid;gap:6px;align-self:flex-start;min-width:0}
.msg.me{align-self:flex-end;background:var(--accent-soft);border-color:var(--accent-line);border-radius:18px 4px 18px 18px}
.msg.in{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*70ms)}
.msg.pop{animation:popin .45s cubic-bezier(.3,1.5,.5,1) both}
.who{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:13px}
.who b{font-weight:600;color:var(--accent-text)}.who span{color:var(--muted);font-size:12px}
.mt{overflow-wrap:anywhere}
.meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.meta time{font-variant-numeric:tabular-nums}
.seen{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.seen .bar{width:84px;height:5px;border-radius:9px;background:color-mix(in srgb,var(--ink) 12%,transparent);overflow:hidden}
.seen .bar i{display:block;height:100%;background:var(--good);border-radius:9px;transition:width .6s ease}
.seen b{color:var(--ink);font-variant-numeric:tabular-nums}
.confirm{display:inline-flex;align-items:center;gap:7px;justify-self:start;padding:7px 12px;border-radius:10px;border:1px solid var(--accent-line);color:var(--accent-text);font-weight:600;font-size:13px;background:var(--surface);transition:all .25s}
.confirm.done{background:var(--good);border-color:var(--good);color:#fff}
.media{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:16/9;background:linear-gradient(150deg,hsl(var(--h) 60% 55%),hsl(calc(var(--h) + 40) 55% 32%));min-width:min(260px,100%)}
.media svg.sc{position:absolute;inset:0;width:100%;height:100%}
.media .tag{position:absolute;left:10px;top:10px;font-size:11px;font-weight:600;color:#fff;background:rgba(0,0,0,.35);padding:3px 9px;border-radius:99px}
.media .pbtn{position:absolute;inset:0;margin:auto;width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.92);color:#10203a;display:grid;place-items:center;transition:transform .2s,opacity .2s}
.media.vid{cursor:pointer}.media.vid:hover .pbtn{transform:scale(1.08)}
.media .pbar{position:absolute;left:12px;right:12px;bottom:10px;height:4px;border-radius:9px;background:rgba(255,255,255,.35);opacity:0}
.media .pbar i{display:block;height:100%;width:0;background:#fff;border-radius:9px}
.media.playing .pbtn{opacity:0;pointer-events:none}.media.playing .pbar{opacity:1}
.media.playing .pbar i{animation:fill 4s linear forwards}
.poll{display:grid;gap:7px;min-width:min(280px,100%)}
.pq{font-weight:600;display:flex;gap:8px;align-items:flex-start}.pq .ic{margin-top:2px;color:var(--accent-text)}
.opt{position:relative;display:flex;justify-content:space-between;gap:10px;text-align:left;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);overflow:hidden;font-size:14px}
.opt i{position:absolute;left:0;top:0;bottom:0;background:color-mix(in srgb,var(--accent) 18%,transparent);transition:width .7s cubic-bezier(.2,.8,.2,1)}
.opt span{position:relative}.opt.sel{border-color:var(--accent)}
.opt .pc{font-weight:600;font-variant-numeric:tabular-nums}
.pt{color:var(--muted);font-size:12px}
.comp{background:var(--surface);border-top:1px solid var(--line);padding:12px 18px;display:grid;gap:10px}
.to{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.to select{padding:6px 10px;border-radius:9px;border:1px solid var(--accent-line);background:var(--accent-soft);color:var(--accent-text);font-weight:600;max-width:100%}
.chk{display:inline-flex;gap:6px;align-items:center;cursor:pointer}.chk input{accent-color:var(--accent)}
.crow{display:flex;gap:8px;align-items:center}
.crow .in{flex:1;min-width:0;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface2)}
.crow .in:focus{outline:0;border-color:var(--accent)}
.icb{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:var(--muted);background:var(--surface2);flex:none;transition:all .2s}
.icb:hover{color:var(--accent-text);background:var(--accent-soft)}
.sendb{width:44px;height:44px;border-radius:13px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none;transition:transform .15s,background .5s}
.sendb:active{transform:scale(.9) rotate(-8deg)}

/* status */
.sv{align-items:center;justify-content:center;padding:18px;gap:12px;overflow:auto}
.svtop{width:100%;display:flex;align-items:center;gap:10px;justify-content:space-between}
.story{position:relative;width:min(100%,380px);aspect-ratio:9/15;max-height:100%;border-radius:24px;overflow:hidden;color:#fff;display:flex;flex-direction:column;padding:14px;box-shadow:var(--shadow);transition:background .5s}
.segs{display:flex;gap:4px}.seg{flex:1;height:3px;border-radius:9px;background:rgba(255,255,255,.3);overflow:hidden}
.seg i{display:block;height:100%;width:0;background:#fff}.seg.done i{width:100%}.seg i.run{animation:fill 4.8s linear forwards}
.sh{display:flex;gap:10px;align-items:center;margin-top:12px;position:relative;z-index:2}
.sh b{display:block;font-weight:600;line-height:1.2}.sh small{opacity:.8;font-size:12px}
.stext{margin:auto 0;font:700 clamp(22px,3.4vw,29px)/1.2 var(--f-display);letter-spacing:-.02em;text-wrap:balance;animation:rise .6s cubic-bezier(.2,.8,.2,1) both;padding:0 4px}
.tap{position:absolute;top:70px;bottom:70px;width:50%;z-index:1}.tap.l{left:0}.tap.r{right:0}
.sf{position:relative;z-index:2;display:flex;gap:8px;align-items:center}
.sf input{flex:1;min-width:0;border-radius:99px;border:1px solid rgba(255,255,255,.5);background:rgba(0,0,0,.2);padding:10px 14px;color:#fff}
.sf input::placeholder{color:rgba(255,255,255,.75)}
.sf button{width:40px;height:40px;border-radius:50%;background:#fff;color:#10203a;display:grid;place-items:center;flex:none}
.sf .views{font-size:13px;opacity:.9}
.compose textarea{flex:1;background:none;border:0;outline:0;color:#fff;font:700 26px/1.2 var(--f-display);resize:none;margin-top:18px;letter-spacing:-.02em}
.compose textarea::placeholder{color:rgba(255,255,255,.65)}
.sw{display:flex;gap:8px}.sw button{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.7);background:hsl(var(--h) 55% 40%);transition:transform .2s}
.sw button.on{transform:scale(1.25);border-color:#fff}
.caught{display:grid;gap:8px;justify-items:center;text-align:center;color:var(--muted)}
.caught .ck{width:60px;height:60px;border-radius:50%;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;animation:popin .5s both}

/* meetings */
.mdetail{overflow:auto;padding:0}
.mhero{background:var(--surface);border-bottom:1px solid var(--line);padding:18px;display:grid;gap:12px}
.mhero h2{font:700 26px/1.1 var(--f-display);letter-spacing:-.025em;text-wrap:balance}
.mrow{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.mrow span{display:inline-flex;gap:7px;align-items:center}
.macts{display:flex;gap:8px;flex-wrap:wrap}
.btn.on{background:var(--good);color:#fff}
.mbody{padding:18px;display:grid;gap:18px;max-width:720px;width:100%}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px}

.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* popover, toast */
.acct{position:absolute;left:68px;bottom:14px;z-index:20;width:250px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px;display:grid;gap:12px;animation:popin .3s cubic-bezier(.3,1.4,.5,1) both;transform-origin:bottom left}
.acct .who2{display:flex;gap:10px;align-items:center}.acct b{display:block;font-weight:600}.acct small{color:var(--muted)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:all .35s cubic-bezier(.3,1.3,.5,1);z-index:50;max-width:calc(100vw - 32px)}
#toast.show{opacity:1;transform:translate(-50%,0)}

@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes popin{from{opacity:0;transform:scale(.88) translateY(8px)}to{opacity:1;transform:none}}
@keyframes appin{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fill{from{width:0}to{width:100%}}
@keyframes blink{50%{opacity:.25}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 45%,transparent)}60%{box-shadow:0 0 0 6px transparent}}

function vote(pid,j){

  if(x=cl('[data-prof]')){gotoPerson(x.dataset.prof);return}
  if(x=cl('[data-go]')){const el=document.getElementById('m'+x.dataset.go);if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1300)}return}
  if(x=cl('[data-pin]')){const c=O().comms[st.sel.comm],id=+x.dataset.pin;c.pinned=c.pinned===id?null:id;toast(c.pinned?'Pinned to the top of this group':'Unpinned');renderMsgs(false);return}
  if(x=cl('#plist [data-p]')){main().classList.add('open');openPerson(+x.dataset.p);return}
  if(cl('#plist [data-meprof]')){main().classList.add('open');openMe();return}
  if(cl('[data-myprof]')){$('#pop').hidden=true;st.tab='people';st.sel.people='me';setTab('people');main().classList.add('open');return}
  if(x=cl('[data-dm]')){openDM(+x.dataset.dm);return}
  if(x=cl('[data-comm]')){st.sel.comm=+x.dataset.comm;st.tab='comm';setTab('comm');main().classList.add('open');return}
  if(x=cl('[data-copy]')){copyTxt(x.dataset.copy);return}
  if(cl('#newGroup')){main().classList.add('open');openGroupForm();return}
  if(cl('[data-theme-toggle]')){const r=document.documentElement,dark=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=dark?'light':'dark';$('#pop').hidden=true;toast(dark?'Light theme on':'Dark theme on');return}
  if(cl('#meBtn')){const p=$('#pop'),r=document.documentElement,dark=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);p.innerHTML=`<div class="who2">${av(st.user.name,'lg')}<div><b>${esc(st.user.name)}</b><small>${esc(st.user.role)}</small></div></div><small>${esc(st.user.email)}<br>Signed in to 5 organizations</small><button class="btn sm ghost" data-myprof>${ic('user',16)} My profile</button><button class="btn sm ghost" data-theme-toggle>${dark?'Switch to light theme':'Switch to dark theme'}</button><button class="btn sm ghost" id="logout">${ic('logout',16)} Log out</button>`;p.hidden=false;return}
  if(cl('#logout')){$('#pop').hidden=true;$('#app').hidden=true;$('#login').hidden=false;clearTimeout(stT);setMode('in');return}
  if(x=cl('#tabs [data-tab]')){if(x.dataset.tab!==st.tab)setTab(x.dataset.tab);return}
  if(x=cl('#fch [data-f]')){st.filter=x.dataset.f;$$('#fch button').forEach(b=>b.classList.toggle('on',b===x));renderList();return}
  if(cl('[data-back]')){main().classList.remove('open');clearTimeout(stT);return}
  if(x=cl('#plist [data-i]')){main().classList.add('open');openComm(+x.dataset.i);return}
  if(cl('[data-add]')){e.stopPropagation();main().classList.add('open');openCompose();return}
  if(cl('#plist [data-me]')){main().classList.add('open');openStatus('me');return}
  if(x=cl('#plist [data-s]')){main().classList.add('open');openStatus(+x.dataset.s);return}
  if(x=cl('#plist [data-m]')){main().classList.add('open');openMeet(+x.dataset.m);return}
  if(cl('#newMeet')){main().classList.add('open');openMeetForm();return}
  if(x=cl('[data-send]')){send(x.dataset.send);return}
  if(x=cl('[data-opt]')){vote(+x.dataset.pid,+x.dataset.opt);return}
  if(x=cl('[data-ack]')){const m=findMsg(+x.dataset.ack);m.done=!m.done;x.classList.toggle('done',m.done);x.innerHTML=ic('check',16)+(m.done?'Confirmed':'Confirm you have read this');if(m.done)toast('Confirmed. The sender can see this.');return}
  if(x=cl('[data-vid]')){if(!x.classList.contains('playing')){x.classList.add('playing');setTimeout(()=>x.classList.remove('playing'),4000)}return}
  if(x=cl('[data-nav]')){stepStory(+x.dataset.nav);return}
  if(cl('[data-reply]')){const r=$('#reply');if(r.value.trim()){toast('Reply sent');r.value=''}return}
  if(x=cl('[data-hu]')){composeHu=+x.dataset.hu;$('#cs').style.background=`linear-gradient(165deg,hsl(${composeHu} 52% 34%),hsl(${(composeHu+36)%360} 58% 17%))`;$$('.sw button').forEach(b=>b.classList.toggle('on',b===x));return}
  if(cl('#postSt')){const v=$('#stx').value.trim();if(!v){$('#stx').focus();return}const my=O().my;my.slides.push({t:v,hu:composeHu});toast('Status shared with everyone');renderList();openStatus('me',my.slides.length-1);return}
  if(cl('[data-join]')){const m=O().meets[st.sel.meet];m.joined=!m.joined;toast(m.joined?'Connected. In the full app this opens the video room.':'You left the meeting');openMeet(st.sel.meet);return}
  if(x=cl('[data-rsvp]')){const m=O().meets[st.sel.meet],v=x.dataset.rsvp;if(m.rsvp===v)return;if(m.rsvp==='yes')m.going--;m.rsvp=v;if(v==='yes')m.going++;
    toast(v==='yes'?'Marked as going':'Host will see you cannot attend');openMeet(st.sel.meet);return}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){st.q=e.target.value;renderList()}if(e.target.id==='pq'){st.pq=e.target.value;renderList()}});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='txt'){e.preventDefault();send('text')}
  if(e.key==='Enter'&&e.target.id==='reply'){e.preventDefault();if(e.target.value.trim()){toast('Reply sent');e.target.value=''}}
});
document.addEventListener('change',e=>{if(e.target.id==='ePhoto'){loadPhoto(e.target.files[0]);e.target.value='';return}if(e.target.id==='pf'){st.pf=e.target.value;renderList()}if(e.target.id==='to'){const i=+e.target.value;$('#txt').placeholder='Write a message to '+O().comms[i].name}});
document.addEventListener('submit',e=>{
  if(e.target.id==='pf2'){e.preventDefault();const u=st.user;u.name=$('#eName').value.trim()||u.name;u.role=$('#eRole').value.trim()||u.role;u.phone=$('#ePhone').value.trim();u.status=$('#eSt').value;u.bio=$('#eBio').value.trim();renderRail();renderList();openMe();toast('Profile saved');return}
  if(e.target.id==='gf'){e.preventDefault();const o=O(),name=$('#gName').value.trim();if(!name)return;
    const type=$('#gType').value,n=$$('#gf .pick input:checked').length+1,text=$('#gMsg').value.trim()||('Welcome to '+name+'. This group is for updates from head office.');
    const m=T(null,'',text,nowStr(),[0,n]);o.comms.push(C(name,type,n,[m]));
    st.sel.comm=o.comms.length-1;st.tab='comm';st.filter='all';st.q='';setTab('comm');main().classList.add('open');tickSeen(m);toast(name+' created with '+n+' members');return}
  if(e.target.id==='mf'){e.preventDefault();const o=O(),t=$('#mTitle').value.trim();if(!t)return;
    const m=M(t,$('#mDay').value,fmt($('#mTime').value),$('#mDur').value,'You',$('#mWho').value,['Start|Welcome and goals','Middle|Updates by branch','End|Actions and owners'],0,(o.comms.find(c=>c.name===$('#mWho').value)||{members:20}).members);
    m.agenda=[`${fmt($('#mTime').value).replace(' ','')}|Welcome and goals`,'Next|Updates by branch','Last|Actions and owners'];
    o.meets.push(m);toast('Meeting scheduled. Invitees are notified.');renderList();openMeet(o.meets.length-1);}
});
</script>
</body>
</html>
